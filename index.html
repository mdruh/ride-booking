<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peer-to-Peer Transfer System</title>
  <link rel="stylesheet" href="style.css">
  <!-- PeerJS Library for WebRTC -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div class="container">
    <h2>P2P Transfer System</h2>

    <!-- ID Section -->
    <div class="card">
      <p>Your ID: <strong id="my-id">Generating...</strong></p>
      <div class="connect-box">
        <input type="text" id="peer-id-input" placeholder="Enter Peer's ID">
        <button id="connect-btn">Connect</button>
      </div>
      <p id="status-text" class="status">Status: Disconnected</p>
    </div>

    <!-- Communication Section -->
    <div class="card">
      <h3>Chat & File Transfer</h3>
      
      <!-- Chat Box -->
      <div id="chat-box" class="chat-box"></div>

      <!-- Controls -->
      <div class="controls">
        <input type="text" id="message-input" placeholder="Type a message..." disabled>
        <button id="send-msg-btn" disabled>Send Text</button>
      </div>

      <div class="controls file-controls">
        <input type="file" id="file-input" accept="image/jpeg" disabled>
        <button id="send-file-btn" disabled>Send JPG</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
