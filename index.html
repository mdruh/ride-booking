<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Call & Chat System</title>
    <!-- PeerJS for Calling -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Google Fonts for Bangla Support (Hind Siliguri) -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #f8fafc;
        }
        body {
            font-family: 'Hind Siliguri', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-bar {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 5px;
        }
        .top-bar select, .top-bar button {
            width: auto;
            padding: 5px 10px;
            background: #334155;
            color: white;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            margin: 0;
            font-size: 13px;
        }
        .top-bar button.logout-btn {
            background: #ef4444;
            display: none; /* Hidden on login screen */
        }
        .card {
            background: var(--panel);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
        }
        .main-container {
            display: none; /* Hidden until logged in */
            width: 100%;
            max-width: 1200px;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media(max-width: 768px) {
            .main-container { grid-template-columns: 1fr; }
        }
        input, select, button {
            padding: 10px;
            margin: 5px 0;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            width: calc(100% - 22px);
            background: #334155;
            color: white;
            font-family: inherit;
        }
        button { background: var(--primary); cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { opacity: 0.9; }
        .row { display: flex; gap: 10px; }
        .row select { width: 45%; }
        .row input { width: 55%; }
        
        .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .video-container { position: relative; cursor: pointer; touch-action: none; }
        .video-container label { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; font-size: 11px; z-index: 2; }
        video { width: 100%; height: 180px; object-fit: cover; background: #000; border-radius: 8px; transform: scaleX(-1); }
        
        /* Fullscreen & PiP layout states */
        .video-container.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999; background: #000; display: flex; align-items: center; justify-content: center; }
        .video-container.fullscreen video { width: 100%; height: 100%; border-radius: 0; object-fit: contain; }
        .video-container.pip-floating { position: fixed; bottom: 30px; right: 30px; width: 140px; height: 100px; z-index: 1000; border-radius: 8px; border: 2px solid rgba(255,255,255,0.3); background: #000; overflow: hidden; cursor: grab; }
        .video-container.pip-floating video { width: 100%; height: 100%; object-fit: cover; }

        /* Group Call Video Grid */
        #groupVideoGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 15px; max-height: 400px; overflow-y: auto; }
        .group-video-container { position: relative; background: #000; border-radius: 8px; height: 140px; overflow: hidden; }
        .group-video-container video { width: 100%; height: 100%; object-fit: cover; transform: none; }
        .group-video-container label { position: absolute; top: 3px; left: 3px; background: rgba(0,0,0,0.6); padding: 1px 4px; border-radius: 3px; font-size: 10px; z-index: 2; }

        .chat-box { height: 150px; background: #0f172a; border-radius: 8px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
        .msg { padding: 6px 10px; border-radius: 6px; max-width: 80%; font-size: 13px; word-break: break-word; }
        .msg.sent { background: #4f46e5; align-self: flex-end; }
        .msg.received { background: #334155; align-self: flex-start; }
        .friend-item { display: flex; justify-content: space-between; background: #334155; padding: 8px; border-radius: 6px; margin-top: 5px; align-items: center; }
        .status { font-size: 13px; color: #38bdf8; text-align: center; margin-bottom: 10px; font-weight: 500; }
    </style>
</head>
<body>

    <!-- Language Selector & Logout Controls at top -->
    <div class="top-bar">
        <button id="logout-btn" class="logout-btn" onclick="logoutUser()" data-i18n="btn_logout_action">Logout</button>
        <select id="language-select" onchange="changeLanguage(this.value)">
            <option value="en" selected>English</option>
            <option value="bn">বাংলা (Bangla)</option>
        </select>
    </div>

    <!-- LOGIN & REGISTRATION SCREEN -->
    <div class="card" id="auth-screen">
        <h2 data-i18n="auth_title">Welcome to Dino Call System</h2>
        <p style="font-size: 13px; color: #94a3b8;" data-i18n="auth_desc">Login or register with your Country Code & Phone Number</p>
        
        <label data-i18n="label_name">Your Name</label>
        <input type="text" id="reg-name" placeholder="Enter your name" data-i18n-placeholder="ph_name">

        <label data-i18n="label_id">Country Code & Phone Number ID</label>
        <div class="row">
            <select id="reg-country">
                <option value="+880">Bangladesh (+880)</option>
                <option value="+1">America (+1)</option>
                <option value="+966" selected>Saudi Arabia (+966)</option>
                <option value="+60">Malaysia (+60)</option>
                <option value="+971">Dubai / UAE (+971)</option>
                <option value="+960">Maldives (+960)</option>
            </select>
            <input type="tel" id="reg-phone" placeholder="Phone number (e.g. 530725809)" data-i18n-placeholder="ph_phone">
        </div>
        <button onclick="loginOrRegister()" style="margin-top: 15px;" data-i18n="btn_login">Login / Register Profile</button>
    </div>

    <!-- MAIN APP SCREEN (Hidden by default) -->
    <div class="status" id="connection-status"></div>
    <div class="main-container" id="app-screen">
        
        <!-- Left Column: Single & Group Call Controls -->
        <div class="card" style="max-width: none;">
            <h3><span data-i18n="room_title">Live Call Room</span> (<span id="display-my-id"></span>)</h3>
            
            <!-- Tabs for 1-on-1 vs Group Call -->
            <div class="row" style="margin-bottom: 15px;">
                <button onclick="switchMode('single')" id="btn-single-mode" style="background:#334155;" data-i18n="btn_single_tab">1-on-1 Call</button>
                <button onclick="switchMode('group')" id="btn-group-mode" style="background:var(--primary);" data-i18n="btn_group_tab">Group Call Room</button>
            </div>

            <!-- Single Call View -->
            <div id="single-call-section">
                <div class="video-grid">
                    <div class="video-container" id="localVideoContainer" onclick="toggleFullscreen('local')">
                        <label data-i18n="lbl_my_video">My Video</label>
                        <video id="localVideo" autoplay muted playsinline></video>
                    </div>
                    <div class="video-container" id="remoteVideoContainer" onclick="toggleFullscreen('remote')">
                        <label data-i18n="lbl_partner_video">Partner Video</label>
                        <video id="remoteVideo" autoplay playsinline></video>
                    </div>
                </div>
                <input type="text" id="target-id-input" placeholder="Partner's Phone ID (e.g. +966530725809)" data-i18n-placeholder="ph_partner_id">
                <div class="row">
                    <button onclick="startCall(true)" data-i18n="btn_video_call">Video Call</button>
                    <button onclick="startCall(false)" style="background: #0ea5e9;" data-i18n="btn_audio_call">Audio Call</button>
                </div>
                <button onclick="endCall()" style="background: #ef4444; margin-top: 5px;" data-i18n="btn_end_call">End Call</button>
            </div>

            <!-- Group Call View -->
            <div id="group-call-section" style="display: none;">
                <p style="font-size:12px; color:#94a3b8;" data-i18n="group_desc">Add participant phone ID numbers one by one (Supports 4, 6, 8, 10 people total)</p>
                
                <label data-i18n="group_capacity_label">Select Group Max Limit:</label>
                <select id="group-capacity" style="background:#334155; color:white; padding:8px; border-radius:6px; width:100%; margin-bottom:10px;">
                    <option value="4" data-i18n="cap_4">Up to 4 People</option>
                    <option value="6" data-i18n="cap_6">Up to 6 People</option>
                    <option value="8" data-i18n="cap_8">Up to 8 People</option>
                    <option value="10" selected data-i18n="cap_10">Up to 10 People</option>
                </select>

                <!-- Input to add IDs iteratively -->
                <div class="row">
                    <input type="text" id="group-member-input" placeholder="Enter ID (+966...)" data-i18n-placeholder="ph_group_input">
                    <button onclick="addGroupMember()" style="width: 35%; background: #0ea5e9;" data-i18n="btn_add">+ Add</button>
                </div>

                <!-- Display list of added participants for this group session -->
                <div style="font-size: 12px; color: #cbd5e1; margin: 8px 0;" data-i18n="group_added_label">Added Members to Call:</div>
                <div id="group-members-chips" style="display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; min-height: 30px;">
                    <!-- Chips appear here -->
                </div>

                <div id="groupVideoGrid">
                    <!-- Local stream in group -->
                    <div class="group-video-container">
                        <label data-i18n="lbl_me">Me</label>
                        <video id="groupLocalVideo" autoplay muted playsinline></video>
                    </div>
                </div>

                <div class="row" style="margin-top:10px;">
                    <button onclick="startGroupCall()" data-i18n="btn_start_group">Start & Ring Group</button>
                    <button onclick="leaveGroupCall()" style="background: #ef4444;" data-i18n="btn_leave_group">Leave Group</button>
                </div>
            </div>
        </div>

        <!-- Right Column: Friends & Chat Panel -->
        <div class="card" style="max-width: none;">
            <h3 data-i18n="chat_section_title">Friends & Chat</h3>
            <div style="margin-bottom: 15px;">
                <input type="text" id="add-friend-input" placeholder="Friend's Full Number ID (+966...)" data-i18n-placeholder="ph_friend_input">
                <button onclick="addFriend()" data-i18n="btn_add_friend">Add Friend</button>
            </div>
            
            <h4 data-i18n="friends_list_title">My Friends List</h4>
            <div id="friends-list" style="max-height: 150px; overflow-y: auto; margin-bottom: 15px;"></div>

            <h4 data-i18n="direct_chat_title">Direct Chat</h4>
            <div class="chat-box" id="chat-messages"></div>
            <input type="text" id="chat-input" placeholder="Type message..." data-i18n-placeholder="ph_chat_input" onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" data-i18n="btn_send">Send</button>
        </div>
    </div>

    let peer, myStream, currentCall, dataConnection;
    let ringInterval = null, audioCtx = null;
    let groupMembersList = [];
    let groupCalls = [];

    // --- CHECK LOCALSTORAGE ON PAGE LOAD ---
    window.addEventListener('DOMContentLoaded', () => {
        const savedUserJson = localStorage.getItem('p2p_current_user');
        if (savedUserJson) {
            try {
                currentUser = JSON.parse(savedUserJson);
                startAppSession();
            } catch (e) {
                console.error("Failed to parse saved session", e);
                localStorage.removeItem('p2p_current_user');
            }
        }
    });

    // --- RINGTONE SYSTEM ---
    function startRingingTone() {
        if (ringInterval) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            function playBeep() {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(480, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.2);
            }
            playBeep();
            ringInterval = setInterval(playBeep, 2500);
        } catch (e) {
            console.log("Audio context error:", e);
        }
    }

    function stopRingingTone() {
        if (ringInterval) {
            clearInterval(ringInterval);
            ringInterval = null;
        }
        if (audioCtx) {
            audioCtx.close().catch(() => {});
            audioCtx = null;
        }
    }

    // --- LOGIN / DATABASE PROFILE HANDLER ---
    async function loginOrRegister() {
        const name = document.getElementById('reg-name').value.trim();
        const country = document.getElementById('reg-country').value;
        let phone = document.getElementById('reg-phone').value.trim();

        if (!name || !phone) {
            return alert(translations[currentLang].err_name_phone);
        }

        phone = phone.replace(/[\s-]/g, '');
        const cleanCountry = country.startsWith('+') ? country : '+' + country;
        const cleanPhone = phone.startsWith('+') ? phone.slice(1) : phone;
        const fullUserId = cleanCountry + cleanPhone;

        const userDocRef = db.collection('users').doc(fullUserId);
        const doc = await userDocRef.get();

        if (doc.exists) {
            currentUser = doc.data();
        } else {
            currentUser = { 
                userId: fullUserId, 
                countryCode: cleanCountry, 
                phone: cleanPhone, 
                name: name, 
                friends: [] 
            };
            await userDocRef.set(currentUser);
        }

        // Save session locally
        localStorage.setItem('p2p_current_user', JSON.stringify(currentUser));
        startAppSession();
    }

    function startAppSession() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'grid';
        document.getElementById('logout-btn').style.display = 'block';
        document.getElementById('display-my-id').innerText = currentUser.userId;

        initPeerSystem(currentUser.userId);
        loadFriendsUI();
    }

    function logoutUser() {
        // Clear local storage and reset session data
        localStorage.removeItem('p2p_current_user');
        if (peer) peer.destroy();
        endCall();

        currentUser = null;
        document.getElementById('app-screen').style.display = 'none';
        document.getElementById('logout-btn').style.display = 'none';
        document.getElementById('auth-screen').style.display = 'block';
        document.getElementById('connection-status').innerText = '';
    }

    function initPeerSystem(userId) {
        const peerId = userId.replace('+', 'plus_');
        peer = new Peer(peerId);

        peer.on('open', () => {
            document.getElementById('connection-status').innerText = translations[currentLang].net_ready;
        });

        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                alert(translations[currentLang].err_online);
            }
        });

        peer.on('call', async (call) => {
            startRingingTone();
            if (confirm(translations[currentLang].incoming_call)) {
                stopRingingTone();
                myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = myStream;
                call.answer(myStream);
                currentCall = call;
                call.on('stream', (stream) => {
                    document.getElementById('remoteVideo').srcObject = stream;
                    document.getElementById('remoteVideo').play().catch(()=>{});
                });
                call.on('close', () => endCall());
            } else {
                stopRingingTone();
                call.close();
            }
        });

        peer.on('connection', (conn) => {
            dataConnection = conn;
            setupChatHandlers();
        });
    }

    // --- UI MODE SWITCHING ---
    function switchMode(mode) {
        if (mode === 'single') {
            document.getElementById('single-call-section').style.display = 'block';
            document.getElementById('group-call-section').style.display = 'none';
            document.getElementById('btn-single-mode').style.background = 'var(--primary)';
            document.getElementById('btn-group-mode').style.background = '#334155';
        } else {
            document.getElementById('single-call-section').style.display = 'none';
            document.getElementById('group-call-section').style.display = 'block';
            document.getElementById('btn-group-mode').style.background = 'var(--primary)';
            document.getElementById('btn-single-mode').style.background = '#334155';
        }
    }

    // --- 1-ON-1 CALL FUNCTIONS ---
    async function startCall(isVideo) {
        let targetId = document.getElementById('target-id-input').value.trim();
        if (!targetId) return alert(translations[currentLang].err_target);

        if (!targetId.startsWith('+')) targetId = '+' + targetId;
        const peerTargetId = targetId.replace('+', 'plus_');

        try {
            myStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
            document.getElementById('localVideo').srcObject = myStream;

            startRingingTone();
            document.getElementById('connection-status').innerText = translations[currentLang].calling;

            dataConnection = peer.connect(peerTargetId);
            setupChatHandlers();

            const call = peer.call(peerTargetId, myStream);
            currentCall = call;

            call.on('stream', (stream) => {
                stopRingingTone();
                document.getElementById('remoteVideo').srcObject = stream;
                document.getElementById('remoteVideo').play().catch(()=>{});
                document.getElementById('connection-status').innerText = translations[currentLang].connected_call;
            });

            call.on('close', () => endCall());
        } catch (err) {
            stopRingingTone();
            alert("Camera/Mic access error.");
        }
    }

    function endCall() {
        stopRingingTone();
        if (currentCall) currentCall.close();
        if (myStream) myStream.getTracks().forEach(t => t.stop());
        document.getElementById('localVideo').srcObject = null;
        document.getElementById('remoteVideo').srcObject = null;
        document.getElementById('connection-status').innerText = translations[currentLang].call_ended;
    }

    // --- GROUP CALL ID ADDITION & RINGING ---
    function addGroupMember() {
        let memberId = document.getElementById('group-member-input').value.trim();
        const maxCapacity = parseInt(document.getElementById('group-capacity').value);

        if (!memberId) return alert(translations[currentLang].err_group_input);
        if (!memberId.startsWith('+')) memberId = '+' + memberId;

        if (memberId === currentUser.userId) {
            return alert(translations[currentLang].err_self_id);
        }

        if (groupMembersList.includes(memberId)) {
            return alert(translations[currentLang].err_already_added);
        }

        if (groupMembersList.length >= maxCapacity - 1) {
            return alert(translations[currentLang].err_capacity(maxCapacity));
        }

        groupMembersList.push(memberId);
        document.getElementById('group-member-input').value = '';
        renderGroupChips();
    }

    function renderGroupChips() {
        const container = document.getElementById('group-members-chips');
        container.innerHTML = '';
        if (groupMembersList.length === 0) {
            container.innerHTML = `<span style="font-size:11px; color:#94a3b8;">${translations[currentLang].no_members_added}</span>`;
            return;
        }

        groupMembersList.forEach((id, index) => {
            const chip = document.createElement('div');
            chip.style.background = '#475569';
            chip.style.padding = '3px 8px';
            chip.style.borderRadius = '12px';
            chip.style.fontSize = '12px';
            chip.style.display = 'flex';
            chip.style.alignItems = 'center';
            chip.style.gap = '5px';
            chip.innerHTML = `${id} <span style="cursor:pointer; color:#f87171; font-weight:bold;" onclick="removeGroupMember(${index})">&times;</span>`;
            container.appendChild(chip);
        });
    }

    function removeGroupMember(index) {
        groupMembersList.splice(index, 1);
        renderGroupChips();
    }

    async function startGroupCall() {
        if (groupMembersList.length === 0) {
            return alert(translations[currentLang].err_min_member);
        }

        try {
            myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('groupLocalVideo').srcObject = myStream;

            startRingingTone();
            document.getElementById('connection-status').innerText = translations[currentLang].ringing_group;

            groupMembersList.forEach(memberId => {
                const peerTargetId = memberId.replace('+', 'plus_');
                const call = peer.call(peerTargetId, myStream);
                groupCalls.push(call);

                call.on('stream', (remoteStream) => {
                    stopRingingTone();
                    appendGroupVideo(memberId, remoteStream);
                    document.getElementById('connection-status').innerText = translations[currentLang].group_active;
                });

                call.on('close', () => {
                    removeGroupVideoUI(memberId);
                });
            });

        } catch (e) {
            stopRingingTone();
            alert("Error accessing camera/mic for group call.");
            console.error(e);
        }
    }

    function appendGroupVideo(memberId, stream) {
        const grid = document.getElementById('groupVideoGrid');
        const existingId = 'group-vid-' + memberId.replace(/[^a-zA-Z0-9]/g, '_');
        if (document.getElementById(existingId)) return;

        const div = document.createElement('div');
        div.className = 'group-video-container';
        div.id = existingId;
        div.innerHTML = `
            <label>${memberId}</label>
            <video autoplay playsinline></video>
        `;
        div.querySelector('video').srcObject = stream;
        div.querySelector('video').play().catch(()=>{});
        grid.appendChild(div);
    }

    function removeGroupVideoUI(memberId) {
        const existingId = 'group-vid-' + memberId.replace(/[^a-zA-Z0-9]/g, '_');
        const el = document.getElementById(existingId);
        if (el) el.remove();
    }

    function leaveGroupCall() {
        stopRingingTone();
        groupCalls.forEach(c => c.close());
        groupCalls = [];
        groupMembersList = [];
        renderGroupChips();

        if (myStream) myStream.getTracks().forEach(t => t.stop());
        document.getElementById('groupVideoGrid').innerHTML = `
            <div class="group-video-container">
                <label data-i18n="lbl_me">${translations[currentLang].lbl_me}</label>
                <video id="groupLocalVideo" autoplay muted playsinline></video>
            </div>
        `;
        document.getElementById('connection-status').innerText = translations[currentLang].left_group;
    }

    // --- FRIEND & CHAT DATABASE HANDLERS ---
    async function addFriend() {
        let friendId = document.getElementById('add-friend-input').value.trim();
        if (!friendId || friendId === currentUser.userId) return alert(translations[currentLang].err_friend_id);

        if (!friendId.startsWith('+')) friendId = '+' + friendId;

        const friendDoc = await db.collection('users').doc(friendId).get();
        if (!friendDoc.exists) {
            return alert(translations[currentLang].err_friend_not_found);
        }

        if (currentUser.friends.includes(friendId)) {
            return alert(translations[currentLang].err_friend_exists);
        }

        currentUser.friends.push(friendId);
        await db.collection('users').doc(currentUser.userId).update({
            friends: currentUser.friends
        });

        // Update local session storage as well
        localStorage.setItem('p2p_current_user', JSON.stringify(currentUser));

        document.getElementById('add-friend-input').value = '';
        loadFriendsUI();
        alert(translations[currentLang].friend_success);
    }

    async function loadFriendsUI() {
        const listDiv = document.getElementById('friends-list');
        listDiv.innerHTML = '';

        if (!currentUser || currentUser.friends.length === 0) {
            listDiv.innerHTML = `<p style="font-size:12px; color:#94a3b8;">${translations[currentLang].no_friends}</p>`;
            return;
        }

        for (let fId of currentUser.friends) {
            const fDoc = await db.collection('users').doc(fId).get();
            if (fDoc.exists) {
                const fData = fDoc.data();
                const div = document.createElement('div');
                div.className = 'friend-item';
                div.innerHTML = `
                    <span><b>${fData.name}</b> (${fData.userId})</span>
                    <button style="width:auto; padding:4px 8px; font-size:11px;" onclick="callFriend('${fData.userId}')">${translations[currentLang].btn_call}</button>
                `;
                listDiv.appendChild(div);
            }
        }
    }

    function callFriend(friendId) {
        document.getElementById('target-id-input').value = friendId;
        switchMode('single');
        startCall(true);
    }

    function setupChatHandlers() {
        dataConnection.on('data', (data) => appendMsg(data, 'received'));
    }

    function sendMessage() {
        const text = document.getElementById('chat-input').value.trim();
        if (!text || !dataConnection) return;
        dataConnection.send(text);
        appendMsg(text, 'sent');
        document.getElementById('chat-input').value = '';
    }

    function appendMsg(text, type) {
        const box = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function toggleFullscreen(type) {
        const local = document.getElementById('localVideoContainer');
        const remote = document.getElementById('remoteVideoContainer');
        local.classList.remove('fullscreen', 'pip-floating');
        remote.classList.remove('fullscreen', 'pip-floating');

        if (type === 'remote') {
            remote.classList.add('fullscreen');
            local.classList.add('pip-floating');
        } else if (type === 'local') {
            local.classList.add('fullscreen');
            remote.classList.add('pip-floating');
        }
    }
</script>
</body>
