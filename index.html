<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Video, Audio & Chat System</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin-bottom: 5px; }
        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin-top: 20px;
        }
        @media(max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
        .card {
            background: var(--panel);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #000;
            border-radius: 8px;
            transform: scaleX(-1);
        }
        input, button {
            padding: 10px;
            margin: 5px 0;
            border-radius: 6px;
            border: none;
            font-size: 14px;
        }
        input { background: #334155; color: white; width: calc(100% - 22px); }
        button { background: var(--primary); color: white; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { opacity: 0.9; }
        .chat-box {
            height: 220px;
            background: #0f172a;
            border-radius: 8px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .msg { padding: 6px 10px; border-radius: 6px; max-width: 80%; font-size: 13px; word-break: break-word;}
        .msg.sent { background: #4f46e5; align-self: flex-end; }
        .msg.received { background: #334155; align-self: flex-start; }
        .status { font-size: 12px; color: #38bdf8; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>

    <h2>খালি ঘরে ইউজার নেইম দিয়ে সেটা আপনার বন্ধুকে পাঠান,</h2>
    <div class="status" id="connection-status">Initializing connection system...</div>

    <div class="container">
        <!-- Left Column: Video & Audio Controls -->
        <div class="card">
            <h3>Media Stream</h3>
            <div class="video-grid">
                <div>
                    <label>My Video</label>
                    <video id="localVideo" autoplay muted playsinline></video>
                </div>
                <div>
                    <label>Partner Video</label>
                    <video id="remoteVideo" autoplay playsinline></video>
                </div>
            </div>
            
            <p>Your ID: <b id="my-id" style="user-select: all;">Setting up...</b></p>
            <input type="text" id="target-id-input" placeholder="Enter Partner's 8-Digit ID">
            <button onclick="startCall(true)">Video Call</button>
            <button onclick="startCall(false)" style="background: #0ea5e9;">Audio-Only Call</button>
            <button onclick="endCall()" style="background: #ef4444;">End Call</button>
        </div>

        <!-- Right Column: User-to-User Text Chat -->
        <div class="card">
            <h3>Direct Chat</h3>
            <div class="chat-box" id="chat-messages"></div>
            <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send Message</button>
        </div>
    </div>

<script>
    let peer;
    let myStream;
    let currentCall;
    let dataConnection;
    let ringInterval = null;
    let audioCtx = null;

    // Prompt user for an 8-digit ID on startup
    function getCustomId() {
        let customId = "";
        while (true) {
            customId = prompt("Enter your custom 8-digit ID/Username:", Math.floor(10000000 + Math.random() * 90000000));
            if (customId === null) {
                // User clicked cancel, generate random 8-digit fallback
                customId = Math.floor(10000000 + Math.random() * 90000000).toString();
                break;
            }
            customId = customId.trim();
            if (/^\d{8}$/.test(customId)) {
                break; // Valid 8-digit number
            }
            alert("Invalid format! Please enter exactly an 8-digit number (e.g., 12345678).");
        }
        return customId;
    }

    function startRingingTone() {
        if (ringInterval) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            function playBeep() {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.5);
            }
            playBeep();
            ringInterval = setInterval(playBeep, 3000);
        } catch (e) {
            console.log("Audio context error:", e);
        }
    }

    function stopRingingTone() {
        if (ringInterval) {
            clearInterval(ringInterval);
            ringInterval = null;
        }
        if (audioCtx) {
            audioCtx.close().catch(() => {});
            audioCtx = null;
        }
    }

    function initPeer() {
        // Get custom 8-digit ID right away
        const customId = getCustomId();

        // Pass custom ID into PeerJS connection
        peer = new Peer(customId);

        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
            document.getElementById('connection-status').innerText = 'Connected! Share your 8-digit ID to receive calls.';
        });

        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                alert("That 8-digit ID is already taken by someone else online. Please refresh and choose another.");
            } else {
                console.error(err);
            }
        });

        peer.on('call', async (call) => {
            const acceptCall = confirm("Incoming call! Do you want to accept?");
            if (!acceptCall) return;
            
            try {
                myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = myStream;
                
                call.answer(myStream);
                currentCall = call;

                call.on('stream', (remoteStream) => {
                    const remoteVideo = document.getElementById('remoteVideo');
                    remoteVideo.srcObject = remoteStream;
                    remoteVideo.play().catch(e => console.log("Playback error:", e));
                    document.getElementById('connection-status').innerText = 'Connected in a live call.';
                });

                call.on('close', () => endCall());
            } catch (err) {
                alert("Could not access camera/mic for answering.");
                console.error(err);
            }
        });

        peer.on('connection', (conn) => {
            dataConnection = conn;
            setupDataConnectionHandlers();
            document.getElementById('connection-status').innerText = 'Data chat channel linked!';
        });
    }

    async function startCall(isVideo) {
        const targetId = document.getElementById('target-id-input').value.trim();
        if (!targetId) return alert("Please enter your partner's 8-digit ID first!");

        try {
            myStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
            document.getElementById('localVideo').srcObject = myStream;

            startRingingTone();
            document.getElementById('connection-status').innerText = 'Calling partner...';

            dataConnection = peer.connect(targetId);
            setupDataConnectionHandlers();

            const call = peer.call(targetId, myStream);
            currentCall = call;

            call.on('stream', (remoteStream) => {
                stopRingingTone();
                const remoteVideo = document.getElementById('remoteVideo');
                remoteVideo.srcObject = remoteStream;
                remoteVideo.play().catch(e => console.log("Playback error:", e));
                document.getElementById('connection-status').innerText = 'Connected in a live call.';
            });

            call.on('close', () => endCall());
        } catch (err) {
            stopRingingTone();
            alert("Error accessing camera/microphone. Check permissions.");
            console.error(err);
        }
    }

    function setupDataConnectionHandlers() {
        dataConnection.on('data', (data) => {
            appendMessage(data, 'received');
        });
    }

    function sendMessage() {
        const input = document.getElementById('chat-input');
        const msg = input.value.trim();
        if (!msg) return;

        if (dataConnection && dataConnection.open) {
            dataConnection.send(msg);
            appendMessage(msg, 'sent');
            input.value = '';
        } else {
            alert("Chat connection not active. Connect via call or connection first.");
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function appendMessage(text, type) {
        const chatBox = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function endCall() {
        stopRingingTone();
        if (currentCall) currentCall.close();
        if (myStream) {
            myStream.getTracks().forEach(track => track.stop());
        }
        document.getElementById('localVideo').srcObject = null;
        document.getElementById('remoteVideo').srcObject = null;
        document.getElementById('connection-status').innerText = 'Call ended.';
    }

    initPeer();
</script>
</body>
</html>
