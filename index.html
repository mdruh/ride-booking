<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Video, Audio & Chat System</title>
    <!-- Include PeerJS Library for serverless WebRTC connection -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin-bottom: 5px; }
        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin-top: 20px;
        }
        @media(max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
        .card {
            background: var(--panel);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            background: #000;
            border-radius: 8px;
            transform: scaleX(-1);
        }
        input, button {
            padding: 10px;
            margin: 5px 0;
            border-radius: 6px;
            border: none;
            font-size: 14px;
        }
        input { background: #334155; color: white; width: calc(100% - 22px); }
        button { background: var(--primary); color: white; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .chat-box {
            height: 250px;
            background: #0f172a;
            border-radius: 8px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .msg { padding: 6px 10px; border-radius: 6px; max-width: 80%; font-size: 13px; }
        .msg.sent { background: #4f46e5; align-self: flex-end; }
        .msg.received { background: #334155; align-self: flex-start; }
        .status { font-size: 12px; color: #38bdf8; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>WebRTC P2P Call & Chat Room, Created by Hridoy</h2>
  
    <div class="status" id="connection-status">Initializing connection system...</div>

    <div class="container">
        <!-- Left Column: Video & Audio Controls -->
        <div class="card">
            <h3>Media Stream</h3>
            <div class="video-grid">
                <div>
                    <label>My Video</label>
                    <video id="localVideo" autoplay muted playsinline></video>
                </div>
                <div>
                    <label>Partner Video</label>
                    <video id="remoteVideo" autoplay playsinline></video>
                </div>
            </div>
            
            <p>Your ID: <b id="my-id">Generating...</b></p>
            <input type="text" id="target-id-input" placeholder="Enter Partner ID to Call">
            <button onclick="startCall(true)">Video Call</button>
            <button onclick="startCall(false)" style="background: #0ea5e9;">Audio-Only Call</button>
            <button onclick="endCall()" style="background: #ef4444;">End Call</button>
        </div>

        <!-- Right Column: User-to-User Text Chat -->
        <div class="card">
            <h3>Direct Chat</h3>
            <div class="chat-box" id="chat-messages"></div>
            <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" style="width: 100%;">Send Message</button>
        </div>
    </div>

<script>
    let peer;
    let myStream;
    let currentCall;
    let dataConnection;

    // Initialize PeerJS (Connects to free cloud broker registry)
    function initPeer() {
        peer = new Peer();

        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
            document.getElementById('connection-status').innerText = 'Connected to network. Ready to call or chat!';
        });

        // Handle incoming calls
        peer.on('call', async (call) => {
            const acceptCall = confirm("Incoming call! Do you want to accept?");
            if (!acceptCall) return;
            
            myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = myStream;
            
            call.answer(myStream);
            currentCall = call;
            
            call.on('stream', (remoteStream) => {
                document.getElementById('remoteVideo').srcObject = remoteStream;
                document.getElementById('connection-status').innerText = 'Connected in a live call.';
            });
        });

        // Handle incoming data connections (Text chat)
        peer.on('connection', (conn) => {
            dataConnection = conn;
            setupDataConnectionHandlers();
            document.getElementById('connection-status').innerText = 'Data chat channel linked!';
        });
    }

    // Setup local media and start an outgoing call
    async function startCall(isVideo) {
        const targetId = document.getElementById('target-id-input').value.trim();
        if (!targetId) return alert("Please enter a target partner ID first!");

        try {
            myStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
            document.getElementById('localVideo').srcObject = myStream;

            // Initiate Data Connection for Chat simultaneously
            dataConnection = peer.connect(targetId);
            setupDataConnectionHandlers();

            // Initiate Media Call
            const call = peer.call(targetId, myStream);
            currentCall = call;

            call.on('stream', (remoteStream) => {
                document.getElementById('remoteVideo').srcObject = remoteStream;
                document.getElementById('connection-status').innerText = 'Connected in a live call.';
            });

            call.on('close', () => endCall());
        } catch (err) {
            alert("Error accessing camera/microphone. Check permissions.");
            console.error(err);
        }
    }

    function setupDataConnectionHandlers() {
        dataConnection.on('data', (data) => {
            appendMessage(data, 'received');
        });
    }

    function sendMessage() {
        const input = document.getElementById('chat-input');
        const msg = input.value.trim();
        if (!msg) return;

        if (dataConnection && dataConnection.open) {
            dataConnection.send(msg);
            appendMessage(msg, 'sent');
            input.value = '';
        } else {
            alert("Chat connection not active. Establish a connection first.");
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function appendMessage(text, type) {
        const chatBox = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function endCall() {
        if (currentCall) currentCall.close();
        if (myStream) {
            myStream.getTracks().forEach(track => track.stop());
        }
        document.getElementById('localVideo').srcObject = null;
        document.getElementById('remoteVideo').srcObject = null;
        document.getElementById('connection-status').innerText = 'Call ended.';
    }

    // Run on startup
    initPeer();
</script>
</body>
</html>
